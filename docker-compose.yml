version: '3.8'

services:
  # ── Rust API Gateway ──────────────────────────────────────
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@db:5432/wiredin
      - REDIS_URL=redis://redis:6379
      - AGGREGATOR_URL=http://aggregator:4000
      - WORKERS_URL=http://workers:8000
      - RUST_LOG=info
      - JWT_SECRET=dev-secret-change-me  # CHANGE THIS IN PRODUCTION
      - CORS_ALLOWED_ORIGINS=  # Comma-separated origins; empty = permissive (dev only)
    depends_on:
      - db
      - redis
    networks:
      - wiredin

  # ── NestJS Aggregation Service ────────────────────────────
  aggregator:
    build: ./aggregator
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/wiredin
      - REDIS_URL=redis://redis:6379
      - WORKERS_URL=http://workers:8000
      - NODE_ENV=development
    depends_on:
      - db
      - redis
    networks:
      - wiredin

  # ── Python Platform Workers ───────────────────────────────
  workers:
    build: ./workers
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/wiredin
      - REDIS_URL=redis://redis:6379
      - FLASK_ENV=development
    depends_on:
      - db
      - redis
    networks:
      - wiredin

  # ── React Dashboard (dev server) ──────────────────────────
  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - VITE_GATEWAY_URL=http://localhost:8080
      - VITE_WS_URL=ws://localhost:8080/ws
    depends_on:
      - gateway
    networks:
      - wiredin

  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wiredin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - wiredin

  # ── Redis (caching + pub/sub) ─────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - wiredin

volumes:
  postgres_data:
  redis_data:

networks:
  wiredin:
    driver: bridge
