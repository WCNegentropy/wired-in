name: E2E Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wiredin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wiredin_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-for-ci
      ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build gateway
        working-directory: gateway
        run: cargo build --release

      - name: Run gateway
        working-directory: gateway
        run: ./target/release/wired_in_gateway &
        env:
          PORT: 8080
          AGGREGATOR_URL: http://localhost:4000
          WORKERS_URL: http://localhost:8000

      - name: Setup Node services
        run: |
          cd aggregator && npm ci && npm run build && npm start &
          cd workers && pip install -r requirements.txt && python main.py &
          cd dashboard && npm ci && npm run dev &

      - name: Wait for services
        run: |
          npx wait-on http://localhost:3000 http://localhost:8080/health --timeout 120000 || true

      - name: Run E2E tests
        working-directory: e2e
        run: npm test
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_GATEWAY_URL: http://localhost:8080

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
