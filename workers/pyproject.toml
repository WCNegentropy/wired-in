[project]
name = "wired-in-workers"
version = "0.1.0"
description = "Wired-In Platform Workers -- unified content adapters for Reddit, YouTube, X, RSS, and News APIs"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
