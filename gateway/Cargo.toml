[package]
name = "wired_in_gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-web-actors = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres"] }  # TODO: Not yet wired up — storage is currently in-memory
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9"  # TODO: Not yet wired up — auth not implemented
redis = "0.25"  # TODO: Not yet wired up — caching not implemented
futures = "0.3"
bytes = "1"
tokio-stream = "0.1"

[dev-dependencies]
actix-rt = "2"
