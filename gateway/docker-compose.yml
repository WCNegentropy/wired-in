version: '3.8'

services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AGGREGATOR_URL=http://aggregator:4000
      - WORKERS_URL=http://workers:8000
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/wired_in_gateway}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RUST_LOG=info
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wired_in_gateway
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
